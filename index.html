<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Контроль исполнения поручений отдела</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button id="navToggle" class="icon-btn" aria-label="Меню" title="Меню">☰</button>
      <a href="#/dashboard" class="brand">📋 Контроль поручений</a>
    </div>
    <nav id="mainNav" class="main-nav">
      <a href="#/dashboard" data-route="dashboard">Дашборд</a>
      <a href="#/registry" data-route="registry">Реестр</a>
      <a href="#/overdue" data-route="overdue">Просрочки</a>
      <a href="#/rating" data-route="rating">Рейтинг</a>
      <a href="#/discipline" data-route="discipline">Справка</a>
      <a href="#/settings" data-route="settings" id="navSettings">Настройки</a>
    </nav>
    <div class="topbar-right">
      <button id="newOrderBtn" class="btn btn-primary" title="Зарегистрировать новое поручение">+ <span class="label">Поручение</span></button>
      <div class="notif-wrap">
        <button id="notifBtn" class="icon-btn" aria-label="Уведомления" title="Уведомления">🔔<span id="notifDot" class="dot hidden"></span></button>
        <div id="notifPanel" class="panel hidden"></div>
      </div>
      <div class="user-wrap">
        <button id="userBtn" class="user-btn"></button>
        <div id="userPanel" class="panel hidden"></div>
      </div>
    </div>
  </header>

  <main id="app" class="app-main"></main>

  <div id="modalRoot" class="modal-root hidden">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-box" id="modalBox"></div>
  </div>

  <div id="toastRoot" class="toast-root"></div>

  <script src="calendar.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
